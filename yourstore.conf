server {
    server_name yourstore.io www.yourstore.io;
  ## gzip config
        gzip on;
        gzip_min_length 32;
        gzip_comp_level 5;
        gzip_proxied any;
        gzip_vary on;
        gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        font/truetype
#       image/bmp
#       image/svg+xml
#       image/x-icon
#       image/jpeg
#       image/png
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/javascript
        text/x-cross-domain-policy;
#proxy_cache  assets_zone;
    root   /var/www/html/yourstore.io/web/;
# disable_symlinks if_not_owner from=$document_root;

# ── Lighthouse / PSI: serve uploads with LONG browser cache.
# PSI flags "short" TTLs (~4 h from upstream) as wasted repeat-visit bandwidth.
# Filenames are fingerprinted/versioned (/blogs/177…-866926.webp): safe for immutable.
# (If you reuse the same URL for a replaced file, shorten TTL or omit immutable.)

# Specific extensions first — long cache headers apply to matched static files after try_files.
location ~ ^/api/uploads/(.*\.(webp|jpe?g|png|gif|svg|ico|woff2))$ {
    access_log off;
    expires      365d;
    add_header   Cache-Control "public, max-age=31536000, immutable" always;
    try_files    $uri $uri/ /uploads/$1;
}

location ~ ^/api/uploads/(.*)$ {

# alias  /home/ashok/ftp/yourstore.io;
try_files $uri $uri/ /uploads/$1;
}


