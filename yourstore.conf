    location /api/ {
        if ($request_uri ~* ".(ico|css|js|gif|jpe?g|png|mp4|webp)$") {
                                               expires 60m;
                                               access_log off;
                                               add_header Pragma public;
                                               add_header Cache-Control "public";
        add_header Last-Modified '$upstream_http_date';
        }
        proxy_read_timeout 300s;
        proxy_cache  assets_zone;
	proxy_connect_timeout 75s;
#	proxy_cache_key $uri;
#	proxy_cache_bypass $http_pragma;
	proxy_cache_revalidate on;
	proxy_cache_valid 304 10m;
	proxy_cache_valid 404 1m;
	proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
       proxy_cache_lock on; # Enable cache locking
        proxy_cache_lock_timeout 5s; # Lock cache for 5 seconds
        proxy_cache_background_update on; # Enable background cache updates
        proxy_pass http://127.0.0.1:4000/;
        proxy_buffer_size          256k;
        proxy_buffers              4 512k;
        proxy_busy_buffers_size    512k;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	add_header X-Cached $upstream_cache_status;
	add_header X-Cache-Status $upstream_status;
        }

    location /login/ {
        root /var/www/html/yourstore.io/web/;
        try_files $uri $uri/ /login/index.html$is_args$args;
    }
    location /hotel-login/ {
        root /var/www/html/yourstore.io/web/;
        try_files $uri $uri/ /hotel-login/index.html$is_args$args;
    }
    location /club-login/ {
        root /var/www/html/yourstore.io/web/;
        try_files $uri $uri/ /club-login/index.html$is_args$args;
    }
    location /invoice/ {
        root /var/www/html/yourstore.io/web/;
        try_files $uri $uri/ /invoice/index.html$is_args$args;
    }
    location /chat/ {
        root /var/www/html/yourstore.io/web/;
        try_files $uri $uri/ /chat/index.html$is_args$args;
    }

    location /blog-server/ {
        		    if ($request_uri ~* ".(ico|css|js|gif|jpe?g|png)$") {
                                               expires 60m;
                                               access_log off;
                                               add_header Pragma public;
                                               add_header Cache-Control "public";
                                      }
        	proxy_max_temp_file_size 0;
        	proxy_set_header   X-Forwarded-For $remote_addr;
        	proxy_pass         http://localhost:9000/;
        	proxy_set_header       Host $host;
        }
   
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.yourstore.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.yourstore.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}

server {
    if ($host = yourstore.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name yourstore.io;
    listen 80;
    return 404; # managed by Certbot


}
