# SSR HTML cache — kept on disk; entries are kept for up to 24 h of no traffic.
# `inactive=24h` matches the stale-while-revalidate budget set by Express in
# server.ts (Cache-Control: public, max-age=3600, stale-while-revalidate=86400)
# so the cached SSR HTML survives long enough that even infrequently-visited
# pages stay warm and don't hit the slow SSR render path on PSI cold runs.
# This directive must live in the http {} context; place this file in nginx sites-enabled.
proxy_cache_path /var/cache/nginx/tulsisilks
    levels=1:2
    keys_zone=tulsisilks_ssr:10m
    max_size=512m
    inactive=24h
    use_temp_path=off;

# Device-type classification used in the proxy_cache_key below. CRITICAL: the
# Angular app uses ngx-device-detector inside AppComponent's constructor to
# pick a mobile vs desktop *ngIf branch in MainHeader's template (mobile menu
# is a drill-in nested UL with go-back buttons; desktop menu is a hover mega
# menu). The SSR HTML therefore varies by device. Without device-aware cache
# keys, the first request (say, mobile) warms the cache and ALL later requests
# (mobile or desktop) get the same cached HTML — desktop browsers then try to
# hydrate mobile DOM and Angular throws `hasAttribute is not a function` at
# the menu UL (main-header.html:212). Splitting the cache by device fixes it.
#
# Detection matches the major patterns used by ngx-device-detector. Tablets
# (iPad, etc.) are bucketed with mobile because isDesktop() in the Angular
# DeviceDetectorService returns false for them, so the SSR renders the mobile
# branch for tablets too.
map $http_user_agent $ts_device_type {
    default                                                            desktop;
    "~*Mobile|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone|Opera Mini|IEMobile" mobile;
}

upstream tulsisilks_up {
    server 127.0.0.1:4007;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name tulsisilks.co.in www.tulsisilks.co.in;

    return 301 https://tulsisilks.co.in$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name tulsisilks.co.in;

    ssl_certificate /etc/letsencrypt/live/tulsisilks.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tulsisilks.co.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    # Compress JS/CSS/JSON/SVG that Express sends uncompressed.
    # Nginx skips re-compression when upstream already sets Content-Encoding (brotli SSR HTML).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location / {

        proxy_pass http://tulsisilks_up;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_cache_bypass $http_upgrade;

        # ── Nginx SSR page cache ──────────────────────────────────────────────
        # Honors the max-age=60 / stale-while-revalidate=300 that Express sets.
        # Only GET/HEAD are cached (POST bypasses automatically).
        # proxy_cache_background_update + use_stale=updating means Nginx keeps
        # serving the stale copy while one background worker fetches a fresh one,
        # so users never wait for the SSR re-render after the 60 s TTL expires.
        proxy_cache               tulsisilks_ssr;
        # Cache key MUST include $ts_device_type — see the map block at the top
        # of this file. Without it, mobile and desktop users share the same
        # cached SSR HTML and Angular hydration throws on whichever device
        # type didn't render first.
        proxy_cache_key           "$scheme$request_method$host$uri$is_args$args$ts_device_type";
        # 1-hour fresh + 24-hour stale-while-revalidate window (mirrors Express
        # Cache-Control: public, max-age=3600, stale-while-revalidate=86400).
        # Goal: collapse cold-cache TTFB (1.5–2.2 s SSR) to warm-cache TTFB
        # (~130 ms) for PSI/Lighthouse runs and real users alike.
        # Tradeoff: CMS edits propagate within 1 h. To purge instantly, run:
        #   nginx -s reload   OR   rm -rf /var/cache/nginx/tulsisilks/*
        proxy_cache_valid         200 1h;
        proxy_cache_valid         301 302 1h;
        proxy_cache_use_stale     error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock          on;

        # Expose cache hit/miss in response for debugging (remove after validating).
        add_header X-Cache-Status  $upstream_cache_status always;
    }
}

# WWW HTTPS → NON-WWW HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.tulsisilks.co.in;

    ssl_certificate /etc/letsencrypt/live/tulsisilks.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tulsisilks.co.in/privkey.pem;

    return 301 https://tulsisilks.co.in$request_uri;
}
