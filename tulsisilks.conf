# Device-type classification
map $http_user_agent $ts_device_type {
    default                                                 desktop;
    "~*Mobile|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone|Opera Mini|IEMobile" mobile;
}

# NOTE: Do NOT put Accept-Encoding in proxy_cache_key. That split the same URL
# into gzip/br/identity variants and stampeded Node under crawl load.
# Force gzip to upstream so one cached body is shared; browsers all accept gzip.

upstream tulsisilks_up {
    server 127.0.0.1:4007;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tulsisilks.co.in www.tulsisilks.co.in;
    return 301 https://tulsisilks.co.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tulsisilks.co.in;

    ssl_certificate /etc/letsencrypt/live/tulsisilks.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tulsisilks.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xhtml+xml image/svg+xml font/woff2;

location = /blogs/silk-saree-shops-and-top-famous-places-to-buy-silk-sarees-for-weddings-in-chennai-deleted { return 301 /blogs/saree-shopping-chennai-tulsi-silks; }
location = /blogs/best-saree-shop-in-chennai-famous-silk-sarees-designer-collections { return 301 /blogs/saree-shopping-chennai-tulsi-silks; }
location = /blogs/georgette-vs-chiffon { return 301 /blogs/chiffon-vs-georgette-sarees; }


 # Keep these 3 blog redirects as they are.

location = /sitemap.xml {
    proxy_pass http://tulsisilks_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 15s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;

    proxy_cache SSR;
    proxy_cache_key "$scheme$request_method$host$uri";
    proxy_cache_valid 200 1h;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    add_header X-Cache-Status $upstream_cache_status always;
}

location / {
    proxy_pass http://tulsisilks_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # One encoding → one cache entry per URL+device (avoids gzip/br stampede).
    proxy_set_header Accept-Encoding "gzip";

    # Was 15s — that is the 504. Cold SSR can exceed 15s under crawl load.
    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_cache SSR;
    proxy_cache_key "$scheme$request_method$host$uri$is_args$args$ts_device_type";
    proxy_cache_valid 200 1h;
    proxy_cache_valid 301 302 1h;

    # Was 2s — waiters stampeded Node. Hold the lock until the first render finishes.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 45s;
    proxy_cache_lock_age 45s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_revalidate on;

    add_header X-Cache-Status $upstream_cache_status always;
}

}
