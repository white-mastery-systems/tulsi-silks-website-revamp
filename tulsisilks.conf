upstream tulsisilks_up {
    server 127.0.0.1:4007;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name tulsisilks.co.in www.tulsisilks.co.in;

    return 301 https://tulsisilks.co.in$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name tulsisilks.co.in;

    ssl_certificate /etc/letsencrypt/live/tulsisilks.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tulsisilks.co.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    # Compress JS/CSS/JSON/SVG that Express sends uncompressed.
    # Nginx skips re-compression when upstream already sets Content-Encoding (brotli SSR HTML).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location / {

        proxy_pass http://tulsisilks_up;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }
}

# WWW HTTPS → NON-WWW HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.tulsisilks.co.in;

    ssl_certificate /etc/letsencrypt/live/tulsisilks.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tulsisilks.co.in/privkey.pem;

    return 301 https://tulsisilks.co.in$request_uri;
}
