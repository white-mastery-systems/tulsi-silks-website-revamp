<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- header -->
<header class="sticky-header" id="headroom-head">
  <header class="cd-main-header">
    <div class="{{template_setting.header_type}} hover-container">
      <div class="row">
        <div [ngClass]="leftLogo? 'col-md-2 col-6 d-flex align-items-center': 'col-12 center-logo'">
          <div class="cd-logo logo">
            <a *ngIf="router.url.indexOf('/others/invalid')==-1">
              <img width="100%" height="100%" appImgLazyLoad class="logo-img" [ImagelazyLoad]="imgBaseUrl+commonService.store_logo" alt="{{commonService.store_details?.name}}">
            </a>
            <a *ngIf="router.url.indexOf('/others/invalid')!=-1">
              <img width="100%" height="100%" class="logo-img" src="assets/images/store.svg" alt="store">
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>
</header>

<!-- body -->
<main id="main-content" tabindex="-1" class="page-container">
  <div class="cd-main-content">
    <router-outlet></router-outlet>
  </div>
</main>
