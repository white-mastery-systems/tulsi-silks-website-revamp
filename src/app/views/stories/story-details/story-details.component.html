<section *ngIf="pageLoader">
  <app-loading-spinner></app-loading-spinner>
</section>

<section class="over-all smooth-fadein" *ngIf="!pageLoader">
  <div class="full-height">
    <amp-story [publisher-logo-src]="imgBaseUrl+commonService.store_logo" [poster-portrait-src]="imgBaseUrl+commonService.store_logo"
      [publisher]="commonService.store_details?.name" [title]="commonService.store_details?.name" standalone>
      <ng-container *ngFor="let x of list; let i=index;">
        <amp-story-page class="cover" auto-advance-after="" id="page{{i+1}}">
          <amp-story-grid-layer template="fill">
            <amp-img tabindex="0" height="1024" width="768" class="image" layout="responsive"
              [attr.src]="imgBaseUrl+x.image" [alt]="x.name"></amp-img>
          </amp-story-grid-layer>
          <amp-story-grid-layer class="align-end" template="vertical">
            <div class="inner-align-end tech-show">
              <h1 *ngIf="x.name" class="phone-heading">{{x.name}}</h1>
              <p class="summary" [ngClass]="(i == list.length-1)? 'last-des': ''">{{x.description}}</p>
            </div>
          </amp-story-grid-layer>
          <amp-story-page-outlink *ngIf="x.btn_status" cta-image="none" cta-accent-element="background"
            cta-accent-color="#000" theme="custom" layout="nodisplay">
            <a role="link" target="_top" [href]="x.link" id="btn_link_next" rel="nofollow">
              <p class="cta_link-next">{{x.btn_name}}</p>
            </a>
          </amp-story-page-outlink>
        </amp-story-page>
      </ng-container>
    </amp-story>
  </div>
</section>
