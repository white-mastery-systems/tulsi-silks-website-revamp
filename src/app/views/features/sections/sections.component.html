<section *ngIf="!commonService.menu_list.length">
  <app-loading-spinner></app-loading-spinner>
</section>

<section class="over-all smooth-fadein" *ngIf="commonService.menu_list.length">

  <!-- breadcrumb -->
  <section class="head-breadcrumb">
    <div class="{{template_setting?.body_type}}">
      <div class="row">
        <!-- <div *ngIf="commonService.discount_page?.page_config?.heading" class="col-md-12">
          <div class="head-breadcrumb-inner border-btm d-flex justify-content-between">
            <div>
              <h2>{{ commonService.discount_page.page_config.heading }}</h2>
              <p *ngIf="commonService.discount_page.page_config?.sub_heading">{{ commonService.discount_page.page_config.sub_heading }}</p>
            </div>
            <div *ngIf="template_setting?.display_goback && commonService?.desktop_device" class="d-flex align-items-center justify-content-end">
              <span (click)="commonService.goBack();">GO BACK</span>
            </div>
          </div>
        </div> -->

        <div *ngIf="template_setting?.breadcrumb" class="col-md-12">
          <div class="breadcrumb-navigation mt-3">
            <ul class="collapsed">
              <li><a routerLink="/">Home</a></li>
              <li><span class="active-page">Sale</span></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!--# breadcrumb #-->

  <section class="common-site-section our-team">
    <div class="{{template_setting?.body_type}}">
      <div class="row">
        <ng-container *ngFor="let menu of commonService.menu_list;">
          <ng-container *ngFor="let section of menu.sections;">
            <!-- By Fabrics -->
            <ng-container *ngIf="params.type=='by-fabrics' && section.name=='By Fabrics'">
              <div *ngFor="let x of section.categories | orderAsc: 'rank';" class="col-lg-3 col-md-6 col-sm-6 col-12 d-flex">
                <div class="team-member gift-card cursor">
                  <figure (click)="!x.btn_status? onSelectDiscount(x): ''">
                    <img width="100%" height="100%" [src]="imgBaseUrl+x.image" alt="offer">
                  </figure>
                  <div class="gift-card-values">
                    <h4 class="text-uppercase">{{x.name}}</h4>
                    <!-- <button class="primary-btn d-flex justify-content-center align-items-center w-100" (click)="onSelectDiscount(x);">{{x.btn_text}}</button> -->
                  </div>
                </div>
              </div>
            </ng-container>
            <!-- By Crafts -->
            <ng-container *ngIf="params.type=='by-crafts' && section.name=='By Crafts'">
              <div *ngFor="let x of section.categories | orderAsc: 'rank';" class="col-lg-3 col-md-6 col-sm-6 col-12 d-flex">
                <div class="team-member gift-card cursor">
                  <figure (click)="!x.btn_status? onSelectDiscount(x): ''">
                    <img width="100%" height="100%" [src]="imgBaseUrl+x.image" alt="offer">
                  </figure>
                  <div class="gift-card-values">
                    <h4 class="text-uppercase">{{x.name}}</h4>
                    <!-- <button class="primary-btn d-flex justify-content-center align-items-center w-100" (click)="onSelectDiscount(x);">View</button> -->
                  </div>
                </div>
              </div>
            </ng-container>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </section>

</section>
