<section *ngIf="pageLoader">
  <app-loading-spinner></app-loading-spinner>
</section>

<section class="over-all smooth-fadein" *ngIf="!pageLoader">

  <section class="head-breadcrumb sections-page-header">
    <div class="container-fluid sections-page-header__container">
      <div class="row">
        <div class="col-12">
          <div class="sections-page-header__inner border-btm">
            <div class="sections-page-header__row d-flex justify-content-between align-items-end flex-wrap">
              <div class="sections-page-header__content">
                <nav *ngIf="template_setting?.breadcrumb" class="breadcrumb-navigation sections-page-header__breadcrumb" aria-label="Breadcrumb">
                  <ul class="collapsed">
                    <li><a routerLink="/">Home</a></li>
                    <li><span class="active-page">{{ activePageName }}</span></li>
                  </ul>
                </nav>
                <h1 class="sections-page-header__title">{{ pageTitle }}</h1>
              </div>
              <div *ngIf="template_setting?.display_goback && commonService?.desktop_device" class="sections-page-header__goback">
                <span (click)="commonService.goBack();">GO BACK</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="common-site-section sections-catalog-section">
    <div class="container-fluid sections-page-header__container">
      <div class="row sections-catalog-grid" *ngIf="displayList.length">
        <div *ngFor="let x of displayList" class="col-lg-3 col-md-6 col-sm-6 col-12 sections-catalog-col">
          <div class="sections-category-card" (click)="onSelectSubCatalog(x)">
            <img *ngIf="itemImage(x)" width="100%" height="100%" appImgLazyLoad [ImagelazyLoad]="itemImage(x)" [alt]="x.name">
            <div class="sections-category-card__shade"></div>
            <p class="sections-category-card__title">{{ x.name }}</p>
          </div>
        </div>
      </div>
      <div class="row" *ngIf="!displayList.length">
        <div class="col-md-12 d-flex align-items-center justify-content-center py-5">
          <p>No collections found.</p>
        </div>
      </div>
    </div>
  </section>

</section>
