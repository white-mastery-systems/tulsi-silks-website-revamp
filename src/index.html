    <div id="pre-bg">
      <!-- Hero rendered in static HTML so LCP is captured before Angular bootstraps.
           Preload links above ensure this img is a cache hit on both mobile and desktop. -->
      <picture>
        <source
          media="(max-width: 720px)"
          srcset="https://yourstore.io/api/uploads/5d30013a5c83a702392c4c8b/layouts/mobile_primary_slider_s.jpg">
        <img
          src="https://yourstore.io/api/uploads/5d30013a5c83a702392c4c8b/layouts/desktop_primary_slider_s.jpg"
          fetchpriority="high"
          decoding="async"
          width="1440"
          height="600"
          alt="Tulsi Silks"
          style="width:100%;height:100%;object-fit:cover;display:block;">
      </picture>
    </div>
    <app-root id="app-root"></app-root>
    <script>
      // When SSR has rendered content into app-root, the pre-bg overlay is no longer
      // needed — hide it immediately so the SSR content is the LCP element.
      // (Angular also removes it in app.component.ngOnInit, but that waits for
      // full JS bootstrap, delaying first paint by 1-2s on slow connections.)
      (function() {
        var ar = document.getElementById('app-root');
        if (ar && ar.childElementCount > 0) {
          var pb = document.getElementById('pre-bg');
          if (pb) pb.style.display = 'none';
        }
      })();
    </script>
