    <link rel="dns-prefetch" href="https://www.clarity.ms">
    <!-- Preload LCP hero — URLs and type MUST match exactly what Angular's SSR <picture>
         renders, otherwise the preload is wasted bandwidth and the actual element triggers
         a second download. Server-side renders mobile_primary_slider.webp (150 KB) for
         (max-width: 720px) and desktop_primary_slider.webp (361 KB) above that. The `media`
         attribute is honored as the preload "applies if" gate, so only the matching variant
         is fetched. -->
    <link rel="preload" as="image" type="image/webp"
      href="https://yourstore.io/api/uploads/5d30013a5c83a702392c4c8b/layouts/mobile_primary_slider.webp"
      media="(max-width: 720px)" fetchpriority="high">
    <link rel="preload" as="image" type="image/webp"
      href="https://yourstore.io/api/uploads/5d30013a5c83a702392c4c8b/layouts/desktop_primary_slider.webp"
      media="(min-width: 721px)" fetchpriority="high">
    <!-- Self-hosted Montaga (12 KB) — used for above-the-fold hero headings. Material Icons
         is NOT preloaded: it's 128 KB, the above-the-fold icons are inline SVG masks in
         styles.scss, and the below-the-fold uses (modals, cart, etc.) tolerate a lazy load
         via @font-face. Removing the Material Icons preload frees ~128 KB of high-priority
         bandwidth that competes with the LCP hero image on Slow 4G. -->
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/montaga.woff2" crossorigin="anonymous">
    <link rel="canonical" href="" id="ccLink">
    <style>
      /* Self-hosted @font-face — declared inline so the browser sees the font src
         in the same parse pass as the preload tag above. font-display: swap mirrors
         what Google Fonts was sending so visible text never goes invisible. The
         unicode-range on Montaga matches Google Fonts' latin subset (~95% of glyphs
         we need) to keep the file at 12 KB. */
      @font-face {
        font-family: 'Montaga';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('assets/fonts/montaga.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Material Icons';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('assets/fonts/material-icons.woff2') format('woff2');
      }
      /* .material-icons utility class — was provided by Google Fonts CSS, now inline. */
      .material-icons {
        font-family: 'Material Icons';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
      /* Header heights mirror `assets/header/type-5.scss` — match exactly so Angular's
         `setBodyMarginTop` measurement on hydration writes the same px and zero CLS. */
      :root { --ts-mast-h: 74px; }
      @media (min-width: 992px) { :root { --ts-mast-h: 78px; } }
      body { margin: 0; margin-top: var(--ts-mast-h); }
      .disp-none { display: none; }
      .dynamic-height { height: calc(100vh - var(--ts-mast-h)); }
      #pre-bg {
        background-color: #f2f2f2;
        width: 100%;
        height: 100vh;
        position: fixed;
        top: 0;
        z-index: 1000;
      }
    </style>

        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "rb61edlc5d");

    <div id="pre-bg">
      <!-- Hero fallback rendered in static HTML in case SSR hasn't populated app-root yet.
           URLs MUST match the preload tags above AND Angular's SSR-rendered <picture> URLs,
           so the browser only downloads one hero image (preloaded → reused by both this
           fallback and Angular's rendered slider). -->
      <picture>
        <source
          media="(max-width: 720px)"
          srcset="https://yourstore.io/api/uploads/5d30013a5c83a702392c4c8b/layouts/mobile_primary_slider.webp"
          type="image/webp">
        <img
          src="https://yourstore.io/api/uploads/5d30013a5c83a702392c4c8b/layouts/desktop_primary_slider.webp"
          fetchpriority="high"
          decoding="async"
          width="1440"
          height="600"
          alt="Tulsi Silks"
          style="width:100%;height:100%;object-fit:cover;display:block;">
      </picture>
    </div>
    <app-root id="app-root"></app-root>
    <script>
      // When SSR has rendered content into app-root, the pre-bg overlay is no longer
      // needed — hide it immediately so the SSR content is the LCP element.
      // (Angular also removes it in app.component.ngOnInit, but that waits for
      // full JS bootstrap, delaying first paint by 1-2s on slow connections.)
      (function() {
        var ar = document.getElementById('app-root');
        if (ar && ar.childElementCount > 0) {
          var pb = document.getElementById('pre-bg');
          if (pb) pb.style.display = 'none';
        }
      })();
    </script>
