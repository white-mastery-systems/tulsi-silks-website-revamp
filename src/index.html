    <!-- Home-only hero image preloads (no fullscreen overlay — #pre-bg was hiding real layout until JS ran). -->
    <script>
      (function () {
        if (typeof window === 'undefined' || typeof document === 'undefined' || typeof location === 'undefined') return;
        var raw = location.pathname || '/';
        var normalized = raw.replace(/\/+$/, '') || '/';
        var isHome = normalized === '/' || normalized === '';
        if (!isHome || !document.head) return;
        function tsPreloadHero(mediaQuery, href) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.type = 'image/webp';
          l.href = href;
          l.setAttribute('fetchpriority', 'high');
          if (mediaQuery) l.media = mediaQuery;
          document.head.appendChild(l);
        }
        tsPreloadHero('(max-width: 720px)', '/assets/perf/mobile_primary_slider.webp');
        tsPreloadHero('(min-width: 721px)', 'https://yourstore.io/api/uploads/5d30013a5c83a702392c4c8b/layouts/desktop_primary_slider.webp');
      })();
    </script>
    <!-- Inline data-URI favicon so the browser never makes a /favicon.ico request.
         Empty href="" used to cause an automatic /favicon.ico fallback on some
         browsers; combined with the missing favicon in dist/, that request was
         falling through to SSR and downloading 755 KB of home page HTML for the
         favicon slot. The 1x1 transparent gif here suppresses that. Angular's
         AppComponent replaces this href at runtime with the store's real favicon. -->
    <link rel="icon" type="image/gif" id="appFavicon" href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    <link rel="preconnect" href="https://yourstore.io" crossorigin="">
    <!-- Deliberately no preconnect to cdnjs: homepage LCP should not open extra TCP/TLS
         slots; jQuery/Swiper load from origin or only after user interaction. -->
    <link rel="dns-prefetch" href="https://www.clarity.ms">
    <!-- LCP hero preloads on `/` — see script after `<meta name="viewport">` (homepage only). -->
    <!-- Self-hosted Montaga (~12 KB) — hero headings. Material Icons preload + stylesheet are
         not deferred so pseudo-elements (::after breadcrumbs, accordion arrows) resolve to
         glyphs instead of ligature text (chevron_right, add, …). -->
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/montaga.woff2" crossorigin="anonymous">
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/material-icons.woff2" crossorigin="anonymous">
    <link rel="canonical" href="" id="ccLink">
    <style>
      /* Self-hosted @font-face — declared inline so the browser sees the font src
         in the same parse pass as the preload tag above. font-display: swap mirrors
         what Google Fonts was sending so visible text never goes invisible. The
         unicode-range on Montaga matches Google Fonts' latin subset (~95% of glyphs
         we need) to keep the file at 12 KB. */
      @font-face {
        font-family: 'Montaga';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('assets/fonts/montaga.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Material Icons stylesheet linked below (`material-icons-deferred.css`). */
      /* Header heights mirror `assets/header/type-5.scss` — match exactly so Angular's
         `setBodyMarginTop` measurement on hydration writes the same px and zero CLS. */
      :root { --ts-mast-h: 74px; }
      @media (min-width: 992px) { :root { --ts-mast-h: 78px; } }
      body { margin: 0; margin-top: var(--ts-mast-h); }
      .disp-none { display: none; }
      .dynamic-height { height: calc(100vh - var(--ts-mast-h)); }
    </style>
    <link rel="stylesheet" href="assets/css/material-icons-deferred.css">
